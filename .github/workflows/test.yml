name: test

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q src
      - name: Build wheel
        if: matrix.python-version == '3.11'
        run: python -m pip wheel . --no-deps -w dist
      - name: Verify packaged Skill bundle
        if: matrix.python-version == '3.11'
        run: python -c "import glob, zipfile; p=glob.glob('dist/*.whl')[0]; n=zipfile.ZipFile(p).namelist(); assert 'github_agent_bridge/skill_bundle/SKILL.md' in n; assert 'github_agent_bridge/skill_bundle/agents/openai.yaml' in n; assert 'github_agent_bridge/skill_bundle/references/cross-platform.md' in n"
